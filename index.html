<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vũ Việt Hùng</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background: #f6f3ee;
      color: #1d1d1b;
    }
    main { text-align: center; max-width: 36rem; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    p {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 1rem;
      opacity: 0.65;
    }
    hr {
      width: 48px;
      border: 0;
      border-top: 1px solid currentColor;
      opacity: 0.4;
      margin: 20px auto;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #161614; color: #ece8e1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vũ Việt Hùng</h1>
    <hr>
    <p>Website đang được xây dựng.</p>
  </main>
</body>
</html>
